name: KOBRA Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:      # Manual trigger

# Required permissions for CodeQL SARIF upload
permissions:
  contents: read
  security-events: write  # Required for upload-sarif action (was 'read' in v1.x, now needs write)

jobs:
  kobra-scan:
    name: KOBRA Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install KOBRA
        run: |
          curl -L https://github.com/shenyo1/kobra/releases/download/v3.3.2/kobra \
            -o /usr/local/bin/kobra
          chmod +x /usr/local/bin/kobra
          kobra --version

      - name: Run KOBRA Scan
        run: |
          mkdir -p kobra-results
          # Default to a safe target (example.com) if secret not set
          TARGET="${{ secrets.TARGET_URL || 'https://example.com' }}"
          # If example.com, use --no-confirm to skip interactive prompt
          kobra -t "${TARGET}" \
            -m crazy \
            --no-confirm \
            --triage \
            --sarif kobra-results/kobra.sarif \
            --html kobra-results/report.html \
            --md kobra-results/report.md \
            -o kobra-results/results.json || echo "Scan complete (some errors may be expected)"

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('kobra-results/kobra.sarif') != ''
        # Use v4 (v3 deprecated December 2026)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: kobra-results/kobra.sarif
          category: kobra

      - name: Upload KOBRA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kobra-scan-results
          path: kobra-results/
          retention-days: 30

      - name: Check for High/Critical findings
        if: always()
        run: |
          if [ -f kobra-results/results.json ]; then
            HIGH=$(python3 -c "
              import json
              try:
                with open('kobra-results/results.json') as f:
                  data = json.load(f)
                if isinstance(data, dict):
                  data = data.get('findings', [])
                high = sum(1 for f in data if f.get('severity') in ['High', 'Critical'])
                print(high)
              except Exception as e:
                print(0)
            " 2>/dev/null || echo "0")
            echo "::notice::✅ KOBRA found $HIGH High/Critical findings"
            if [ "$HIGH" -gt "0" ]; then
              echo "::warning::$HIGH High/Critical findings detected!"
            fi
          else
            echo "::notice::No results.json produced (scan may have failed)"
          fi